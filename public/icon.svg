<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 抹茶ラテのような可愛らしく柔らかいグラデーション -->
    <linearGradient id="cuteMatcha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#748B47" />
      <stop offset="100%" stop-color="#4B612C" />
    </linearGradient>
  </defs>

  <!-- メイン背景 -->
  <rect width="512" height="512" rx="112" fill="url(#cuteMatcha)" />

  <!-- 背景の水玉ドット -->
  <circle cx="70" cy="80" r="40" fill="#F8F9F5" opacity="0.1" />
  <circle cx="440" cy="90" r="55" fill="#F8F9F5" opacity="0.08" />
  <circle cx="80" cy="430" r="50" fill="#F8F9F5" opacity="0.08" />
  <circle cx="430" cy="420" r="40" fill="#F8F9F5" opacity="0.1" />

  <!-- ステッチ枠 -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#F8F9F5" stroke-width="3" stroke-dasharray="12 8" opacity="0.3" />

  <!-- テキスト（超特大サイズ版） -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Maru Gothic ProN', 'Zen Maru Gothic', sans-serif" text-anchor="middle">
    <!-- 上段：いぶきの -->
    <text x="256" y="205" font-weight="800" font-size="68" fill="#E8F0D8" letter-spacing="4">
      いぶきの
    </text>

    <!-- 下段：人生経営 -->
    <text x="256" y="335" font-weight="900" font-size="96" fill="#F8F9F5" letter-spacing="6">
      人生経営
    </text>
  </g>
</svg>